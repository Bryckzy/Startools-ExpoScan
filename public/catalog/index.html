<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d0f12"><title>ExpoPulse — Catálogo</title><style>
:root{--bg:#0d0f12;--card:#171a1f;--line:#29303a;--txt:#f5f7fa;--muted:#8e99a7;--a:#d7ff3f;--max:720px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.app{width:min(100%,var(--max));min-height:100dvh;margin:auto;padding-bottom:82px}.top{position:sticky;top:0;z-index:10;background:#0d0f12f2;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff0c;padding:calc(env(safe-area-inset-top) + 10px) 14px 13px}.mode{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#747f8c}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:4px 0 12px}.brand{font-size:24px;font-weight:950;letter-spacing:-.04em}.event{font-size:12px;color:#8792a0;text-align:right}.searchrow{display:flex;gap:7px}.search{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#191d22;color:var(--txt);font-size:16px;padding:0 14px;outline:0}.clear{display:none;width:48px;border:1px solid var(--line);border-radius:13px;background:#191d22;color:#aeb7c4;font-size:18px}.search:focus-visible,.clear:focus-visible,.btn:focus-visible,.secondary:focus-visible,.primary:focus-visible{outline:3px solid #fff;outline-offset:2px}.count{padding:15px 15px 7px;color:#788391;font-size:12px}.list{display:grid;gap:9px;padding:0 11px}.item{background:linear-gradient(#171a1f,#13161a);border:1px solid var(--line);border-radius:17px;padding:15px}.name{font-size:18px;font-weight:900;letter-spacing:-.025em}.sku{font:11px ui-monospace,monospace;color:#7b8694}.cat{display:inline-block;margin-top:10px;padding:4px 7px;border-radius:7px;background:#20252b;color:#b4bdc8;font-size:11px}.desc{color:#929ca9;margin:10px 0 13px}.btn{width:100%;min-height:48px;border:0;border-radius:11px;background:var(--a);color:#090b0e;font-weight:900}.empty,.err{text-align:center;padding:58px 24px;color:#788391}.err strong{display:block;color:#e7ebf0}.foot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--max));padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0d0f12 35%)}.foot div{background:#15191e;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;color:#85909e;font-size:10px}.sheet{display:none;position:fixed;inset:0;background:#000a;z-index:30;align-items:flex-end}.sheet.open{display:flex}.panel{width:min(100%,var(--max));margin:auto;background:#171a1f;border:1px solid #303741;border-bottom:0;border-radius:22px 22px 0 0;padding:19px 16px calc(18px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 6px;font-size:20px}.panel p{margin:0 0 14px;color:#929ca9}.preview{background:#20252b;border-radius:12px;padding:11px;color:#d0d7df;font-size:12px;margin-bottom:11px}.actions{display:grid;grid-template-columns:1fr 1.7fr;gap:8px}.secondary,.primary{min-height:48px;border-radius:11px;font-weight:900}.secondary{background:#1c2026;color:#bdc5cf;border:1px solid #343b45}.primary{background:var(--a);color:#090b0e;border:0}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#f5f7fa;color:#090b0e;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:850;transition:.18s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><script src="/assets/catalog-core.js" defer></script></head><body><div class="app"><header class="top"><div class="mode" id="mode">Catálogo ExpoPulse</div><div class="head"><div class="brand" id="brand">Carregando…</div><div class="event" id="event"></div></div><div class="searchrow"><input id="q" class="search" type="search" placeholder="Buscar produto ou SKU" autocomplete="off" aria-label="Buscar produto ou SKU"><button id="clear" class="clear" aria-label="Limpar busca">×</button></div></header><div id="count" class="count"></div><main id="list" class="list" aria-live="polite"></main></div><div class="foot"><div id="footText">O interesse vai direto para o WhatsApp comercial da marca.</div></div><div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="panel"><h2 id="sheetTitle">Tenho interesse</h2><p>Revise a mensagem antes de continuar.</p><div id="message" class="preview"></div><div class="actions"><button id="cancel" class="secondary">Voltar</button><button id="action" class="primary">Abrir WhatsApp →</button></div></div></div><div id="toast" class="toast">Demonstração: nenhuma mensagem foi enviada.</div><script>
window.addEventListener('DOMContentLoaded',async()=>{const C=window.ExpoPulseCore,$=id=>document.getElementById(id),p=new URLSearchParams(location.search),slug=(p.get('c')||'demo').replace(/[^a-z0-9_-]/gi,'');let cfg,selected,lastFocus;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const rows=C.searchProducts(cfg.products,$('q').value);$('clear').style.display=$('q').value?'block':'none';$('count').textContent=`${rows.length} produto${rows.length===1?'':'s'}`;$('list').innerHTML=rows.length?rows.map(x=>`<article class="item"><div class="name">${esc(x.name)}</div>${x.sku?`<div class="sku">SKU ${esc(x.sku)}</div>`:''}${x.category?`<span class="cat">${esc(x.category)}</span>`:''}${x.description?`<p class="desc">${esc(x.description)}</p>`:''}<button class="btn" data-i="${cfg.products.indexOf(x)}" aria-label="Tenho interesse em ${esc(x.name)}">Tenho interesse</button></article>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>';document.querySelectorAll('.btn').forEach(b=>b.onclick=()=>open(cfg.products[+b.dataset.i],b))}function open(x,el){selected=x;lastFocus=el;$('sheetTitle').textContent=x.name;$('message').textContent=C.buildMessage(cfg,x);$('action').textContent=cfg.whatsapp?'Abrir WhatsApp →':'Simular WhatsApp →';$('sheet').classList.add('open');document.body.style.overflow='hidden';$('cancel').focus()}function close(){$('sheet').classList.remove('open');document.body.style.overflow='';selected=null;lastFocus?.focus()}$('q').oninput=()=>cfg&&render();$('clear').onclick=()=>{$('q').value='';render();$('q').focus()};$('cancel').onclick=close;$('sheet').onclick=e=>{if(e.target===$('sheet'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('open'))close()});$('action').onclick=()=>{if(!selected)return;if(cfg.whatsapp){location.href=C.buildWhatsAppUrl(cfg,selected)}else{close();$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1700)}};try{cfg=C.configFromQuery(location.search);if(!cfg){const r=await fetch(`/catalogs/${slug}.json`,{cache:'no-store'});if(!r.ok)throw Error('Catálogo não encontrado');cfg=C.sanitizeConfig(await r.json())}$('brand').textContent=cfg.brand;$('event').textContent=cfg.event||'';$('mode').textContent=cfg.demo?'Demonstração ExpoPulse • não oficial':'Catálogo do estande';$('footText').textContent=cfg.demo?'Demonstração: nenhum dado é coletado e nenhuma mensagem real é enviada.':'O interesse vai direto para o WhatsApp comercial da marca.';render()}catch(e){$('brand').textContent='ExpoPulse';$('q').disabled=true;$('list').innerHTML=`<div class="err"><strong>Catálogo indisponível</strong>${esc(e.message)}</div>`}});
</script></body></html>
